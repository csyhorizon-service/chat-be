services:
  postgres:
    image: postgres:16
    container_name: study-postgres
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: test
      POSTGRES_DB: studydb
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: study-redis
    ports:
      - "6379:6379"